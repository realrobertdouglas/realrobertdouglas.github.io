title: Douglas Labs
description: Build before it is too late. 
author: Douglas Labs
github: https://github.com/realrobertdouglas
tagline: Life is short, art is long.
disqus_shortname: ""

enableTags: true
tagarray: []

collections: {}

social: []

share:
  twitter_username:
  fb_appid: ""



url: "https://douglas.lol"
baseurl: ""

markdown: kramdown
plugins:
  - jekyll-gist

# Files kept in the repo but not published. Setting this replaces Jekyll's own list,
# so its defaults (Gemfile ... vendor, and CNAME from GitHub Pages) are repeated here.
exclude:
  - new-post
  - CNAME
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  ignore:
    envs: ['development']
# UTC matches the GitHub Pages build, so post dates and URLs are the same locally and live
timezone: UTC

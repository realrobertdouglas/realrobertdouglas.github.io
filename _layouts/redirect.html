{% comment %}Forwards an old post address to its new one. The pages in /redirects/ keep the old permalink and set redirect_to.{% endcomment %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved</title>
<link rel="canonical" href="{{ site.url }}{{ page.redirect_to }}">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">
<script>location.replace({{ page.redirect_to | jsonify }} + location.hash);</script>
</head>
<body>
<p>This post has moved to <a href="{{ page.redirect_to }}">{{ site.url }}{{ page.redirect_to }}</a>.</p>
</body>
</html>

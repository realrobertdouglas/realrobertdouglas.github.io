---
layout: default
---
<article class="post rs-page">
  {% include research/crumbs.html %}
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.summary %}<p class="post-subtitle">{{ page.summary }}</p>{% endif %}
  </header>
  <span class="time">Updated {{ page.updated | date: '%B %-d, %Y' }}</span>
  <div class="post-content">
    {{ content }}
  </div>
</article>
